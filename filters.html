<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tidy Tube — Filters</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="design/tokens.css">
  <link rel="stylesheet" href="css/filters.css">
</head>
<body class="tidy-ui">
  <header class="bar">
    <a class="back" href="https://www.youtube.com/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      <span>YouTube</span>
    </a>
    <nav class="bar-nav" aria-label="Tidy Tube">
      <button type="button" id="open_history">Clean watch history</button>
      <a href="hn.html">Hacker News</a>
    </nav>
  </header>

  <main>
    <header class="top">
      <div>
        <h1>Filters</h1>
        <p class="lead">Turn filters on to hide matching videos across YouTube. Expand any filter to customize its channels or title keywords.</p>
      </div>
      <span class="saved" id="saved" aria-live="polite"></span>
    </header>

    <section id="list" aria-label="Filter categories"></section>

    <button type="button" class="add" id="add">+ Add custom filter</button>

    <section class="tester">
      <h2>Test a video</h2>
      <div class="tester-row">
        <input id="t-title" type="text" placeholder="Video title" autocomplete="off">
        <input id="t-channel" type="text" placeholder="Channel name or @handle" autocomplete="off">
      </div>
      <p class="tester-out" id="t-out" aria-live="polite">Type a title or channel to see if any filter catches it.</p>
    </section>

    <footer class="foot">
      <button type="button" class="link" id="reset">Restore default filters</button>
      <span class="tip">Keywords match whole words. Use <code>*</code> for prefix (<code>election*</code>) or <code>/regex/</code>.</span>
    </footer>
  </main>

  <template id="card">
    <article class="card">
      <div class="head">
        <label class="switch" title="Hide matching videos on YouTube">
          <input type="checkbox" class="enabled">
          <span class="toggle" aria-hidden="true"></span>
        </label>
        <input class="name" type="text" aria-label="Filter name" placeholder="Filter name">
        <span class="badge-builtin" hidden>Built-in</span>
        <span class="count"></span>
        <button type="button" class="more" aria-expanded="false" aria-label="Edit channels and keywords">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
        </button>
      </div>

      <div class="body" hidden>
        <p class="builtin" hidden></p>

        <div class="field" data-kind="channels">
          <div class="field-head">
            <span class="label">Channels</span>
            <button type="button" class="mode-btn">Bulk edit</button>
          </div>
          <div class="chip-view">
            <div class="quick-add">
              <input type="text" class="add-input" placeholder="Add channel name or @handle…" autocomplete="off">
              <button type="button" class="add-btn">Add</button>
            </div>
            <div class="chips"></div>
          </div>
          <textarea class="bulk" hidden spellcheck="false" placeholder="One channel or @handle per line"></textarea>
        </div>

        <div class="field" data-kind="words">
          <div class="field-head">
            <span class="label">Title keywords</span>
            <button type="button" class="mode-btn">Bulk edit</button>
          </div>
          <div class="chip-view">
            <div class="quick-add">
              <input type="text" class="add-input" placeholder="Add keyword or phrase…" autocomplete="off">
              <button type="button" class="add-btn">Add</button>
            </div>
            <div class="chips"></div>
          </div>
          <textarea class="bulk" hidden spellcheck="false" placeholder="One keyword or phrase per line"></textarea>
          <span class="error" hidden></span>
        </div>

        <div class="card-foot">
          <button type="button" class="link danger delete">Delete filter</button>
        </div>
      </div>
    </article>
  </template>

  <script src="js/junk.js"></script>
  <script src="js/filters.js"></script>
</body>
</html>
