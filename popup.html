<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tidy Tube</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <h1>Tidy Tube</h1>

  <h2>Filters</h2>
  <button type="button" class="action" id="filters_open">Edit filters</button>
  <p class="note">Music, Mixes and your own categories of channels and title words. Clean them out of your history, hide them, or tell YouTube you're not interested.</p>

  <h2 class="gap">Hide on YouTube</h2>
  <label class="tile"><input type="checkbox" id="hide_shorts"><span class="name">Shorts</span><span class="state"></span></label>

  <h2 class="gap">Hacker News</h2>
  <label class="tile"><input type="checkbox" id="show_hn"><span class="name">Show in sidebar</span><span class="state"></span></label>
  <button type="button" class="action" id="hn_open">Open Hacker News</button>
  <p class="note"><span id="hn_stats"></span> <button type="button" id="hn_reset" hidden>Reset</button></p>
  <script src="js/popup.js"></script>
</body>
</html>
