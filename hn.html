<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hacker News</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="design/tokens.css">
  <link rel="stylesheet" href="css/hn.css">
</head>
<body class="tidy-hn">
  <div id="app">
    <!-- Tidy Tube's own thin bar; YouTube's chrome isn't part of this page -->
    <header class="bar">
      <a class="back" href="https://www.youtube.com/" title="Back to YouTube">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        <span>YouTube</span>
      </a>
      <nav class="views" aria-label="Views">
        <a href="#browse" data-tab="browse">Browse</a>
        <a href="#foryou" data-tab="foryou">For you</a>
        <a href="#channels" data-tab="channels">Channels</a>
        <a href="#watched" data-tab="watched">Watched</a>
      </nav>
    </header>

    <main id="view" aria-live="polite">
      <div class="loading" aria-hidden="true">
        <div class="bar-skel"></div>
        <div class="grid">
          <div><div class="thumb"></div><div class="line"></div><div class="line short"></div></div>
          <div><div class="thumb"></div><div class="line"></div><div class="line short"></div></div>
          <div><div class="thumb"></div><div class="line"></div><div class="line short"></div></div>
          <div><div class="thumb"></div><div class="line"></div><div class="line short"></div></div>
          <div><div class="thumb"></div><div class="line"></div><div class="line short"></div></div>
          <div><div class="thumb"></div><div class="line"></div><div class="line short"></div></div>
          <div><div class="thumb"></div><div class="line"></div><div class="line short"></div></div>
          <div><div class="thumb"></div><div class="line"></div><div class="line short"></div></div>
        </div>
      </div>
    </main>

    <footer class="credit">
      Videos Hacker News commenters keep recommending, from
      <a href="https://hackertube.org/" target="_blank" rel="noopener">HackerTube</a>
      (ODC-By). Everything Tidy Tube learns stays in this browser.
    </footer>
  </div>

  <script src="js/junk.js"></script>
  <script src="js/hn.js"></script>
</body>
</html>
